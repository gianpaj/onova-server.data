apps:
  - script : npm
    args: start
    cwd: ./server.data
    name   : 'server.data'
    wait_ready: true
    # autorestart: true
    env    :
      NODE_ENV: production
      PORT: 4040
  - script : npm
    args: start
    cwd: ./server.push
    name   : 'server.push'
    wait_ready: true
    # autorestart: true
    env    :
      NODE_ENV: production
  - script : npm
    args: start
    cwd: ./server.chat
    name   : 'server.chat'
    wait_ready: true
    # autorestart: true
    env    :
      NODE_ENV: production
      PORT: 8142
  - script : npm
    args: start-push
    cwd: ./server.chat
    name   : 'server.chat-push'
    wait_ready: true
    autorestart: true
    env    :
      NODE_ENV: production
