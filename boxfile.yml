run.config:
  engine: nodejs
  engine.config:
    runtime: nodejs-8.9
  cache_dirs:
    - node_modules
  extra_steps:
    - npm install
  build_triggers:
    - package.json
  extra_packages:
    - nginx
    # - newrelic

web.main:
  start:
    nginx: nginx -c /app/config/nginx.conf
    node: npm run prod:build && npm run prod:start
  log_watch:
    app[error]: /app/error.log
  writable_dirs:
    - lib

data.db:
  image: nanobox/mongodb:3.4
